[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-earth-mcp"
version = "0.1.0"
description = "MCP server giving AI assistants traceable, verifiable access to open Earth-observation data (Sentinel-2, ESA WorldCover, Copernicus DEM) via Microsoft Planetary Computer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Landon Melesky" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "geoai", "remote-sensing", "sentinel-2", "stac", "gis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "mcp>=2.0,<3",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "odc-stac>=0.3.10",
  "rasterio>=1.3",
  "numpy>=1.26",
  "pyproj>=3.6",
  "shapely>=2.0",
  "anyio>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
open-earth-mcp = "open_earth_mcp.server:main"

[tool.setuptools]
packages = ["open_earth_mcp"]

[tool.pytest.ini_options]
markers = ["network: live calls to Planetary Computer (deselect with -m 'not network')"]
addopts = "-m 'not network'"
testpaths = ["tests"]
filterwarnings = [
  "ignore::PendingDeprecationWarning:odc.geo",
  "ignore::DeprecationWarning:planetary_computer",
]
